<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings | BufferBuddy TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
<h1 class="pg">Settings</h1>
<div class="split"><div class="card">
<div class="field"><span>Colour theme</span><div class="row"><button class="btn" data-t="neon">Neon night</button><button class="btn" data-t="sunset">Sunset</button><button class="btn" data-t="retro">Retro green</button></div></div>
<label class="field"><span>Animation speed <b id="speedV"></b></span><input id="speed" type="range" min="0.5" max="2" step="0.25"></label>
<label class="field"><span>Seconds between auto-demo events <b id="gapV"></b></span><input id="gap" type="range" min="1" max="10"></label>
<label class="field"><span>Seconds each auto-demo event lasts <b id="holdV"></b></span><input id="hold" type="range" min="2" max="12"></label>
<label class="row2"><span>Show funny captions</span><input id="caps" type="checkbox"></label>
<div class="row" style="margin-top:14px"><button class="btn" id="reset">Restore defaults</button></div>
</div><div><div class="tv" id="tv" data-th="neon" aria-label="Simulated TV screen">
  <div class="scene"><div class="now">Now playing</div><div class="ttl">Space Cats, Episode 4</div><div class="bar"><i></i></div></div>
  <div class="hud"><span>Playing</span><span>Entertained for <b>0s</b></span></div>
  <div class="ov" role="status" aria-live="polite"><span class="tag"></span><div class="stage"></div><div class="cap"></div></div>
</div><div style="margin-top:10px"><button class="btn pri" id="try">Preview a buffering moment</button></div></div></div>
</main>
<script src="js/utils.js"></script>
<script src="js/store.js"></script>
<script src="js/characters.js"></script>
<script src="js/engine.js"></script>
<script src="js/nav.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
